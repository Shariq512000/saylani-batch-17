<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Table</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Column 1</th>
                <th>Column 2</th>
                <th>Column 3</th>
                <th>Column 4</th>
                <th>Column 5</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Row 1 Col 1</td>
                <td>Row 1 Col 2</td>
                <td>Row 1 Col 3</td>
                <td>Row 1 Col 4</td>
                <td>Row 1 Col 5</td>
            </tr>

            <tr>
                <td>Row 2 Col 1</td>
                <td>Row 2 Col 2</td>
                <td rowspan="2">Row 2 Col 3</td>
                <td>Row 2 Col 4</td>
                <td>Row 2 Col 5</td>
            </tr>

            <tr>
                <td>Row 3 Col 1</td>
                <td>Row 3 Col 2</td>
                <td>Row 3 Col 4</td>
                <td>Row 3 Col 5</td>
            </tr>

            <tr>
                <td>Row 4 Col 1</td>
                <td>Row 4 Col 2</td>
                <td>Row 4 Col 3</td>
                <td>Row 4 Col 4</td>
                <td>Row 4 Col 5</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
