<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ternary Operator</title>
</head>
<body>
    
    <script>
        let percentage = 81;
        let grade = (percentage >= 80 ) ? "A+" : (percentage >= 70 ) ? "A" : (percentage >= 60) ? "B" : (percentage >= 50) ? "C" : (percentage >= 40) ? "D" : (percentage >= 33) ? "E" : "Failed";
        console.log(grade)
    </script>
</body>
</html>
